<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="images/favicon.ico" type="image/icon">
  <style>
 @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');
</style>
  <title>Autour du monde</title>
</head>
<body>
  <header>
    <h1>Autour du Monde</h1>
  
     <img src="images/d3fba92eaa7f15065df47603a44258f8a9a4972cbe1ff2ca11ce6657ce289dc7.png" alt="Wood Mapworld" class="center-img">
    </header>
<section>
    <p>Pour bien se préparer à voyager, il y a des indispensables à savoir et à avoir !<br> Voici donc une petite liste de choses à vérifier avant de quitter le pays:</p>
<br>
  <label class="check-list">
    <input type="checkbox" name="modalité">
    Se renseigner sur les modalités d'entrée sur le territoire (visa,titre de séjour ou autorisation de voyage).
    </label>
    <label class="check-list">
    <input type="checkbox" name="devises">Les devises utilisées dans le pays
    </label>
    <label class="check-list">
    <input type="checkbox" name="cb">Une carte bancaire sans frais à l'étranger du type boursorama.
    </label>
    <label class="check-list">
    <input type="checkbox" name="assurance">Une assurance voyage pour ce qui est hors de l'Union Européenne.
    </label>
    <label class="check-list">
    <input type="checkbox" name="adaptateur">Avoir un adaptateur de prise pour recharger vos appareils.
    </label>
    <label class="check-list">
    <input type="checkbox" name="sac">Avoir un sac repliable, bien pratique pour ne pas être encombré.
    </label>

</section>
</body>
</html>
